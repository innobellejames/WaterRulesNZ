name: Daily official water updates
on:
  schedule:
    - cron: '15 18 * * *' # 06:15 NZST / 07:15 NZDT
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official source snapshots
        run: node refresh-updates.mjs
      - name: Commit verified snapshot
        run: |
          git config user.name 'WaterRulesNZ updater'
          git config user.email 'updates@users.noreply.github.com'
          git add updates.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh official water updates'
            git push
          fi
      - name: Stage the public website
        run: |
          mkdir -p _site
          cp index.html styles.css script.js *.svg share-water-rules.png updates.json _site/
          for folder in agentic downloads images assets; do
            if [ -d "$folder" ]; then cp -R "$folder" _site/; fi
          done
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish refreshed website
        id: deployment
        uses: actions/deploy-pages@v4
